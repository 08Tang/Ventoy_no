# UNLOCK: custom Ventoy partition numbers (1-based; works for GPT and MBR).
#   VTOY_ISO_PART_NUM : partition that stores the ISO images and ventoy.json
#   VTOY_EFI_PART_NUM : partition that holds /grub /ventoy /tool
# Copy/edit this file to /grub/ventoy_part.cfg on the target device.
set VTOY_ISO_PART_NUM=1
set VTOY_EFI_PART_NUM=2